
name: Energy strategy tool checks

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "energy-strategy-tool/app/**"
      - ".github/workflows/energy-tool-tests.yml"
  pull_request:
    paths:
      - "energy-strategy-tool/app/**"
      - ".github/workflows/energy-tool-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: energy-strategy-tool/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: energy-strategy-tool/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build standalone app
        run: npm run build

      - name: Run engine and build tests
        run: npm test
