# Builds the unsigned Windows (x64) desktop program and offers it as a download on the workflow run (Artifacts).
# A Linux build is made only to launch-test the program under a virtual display (GitHub cannot launch the Windows build
# here); it is not offered for download. The owner chose Windows and phone only (2026-10-21): no macOS or Linux downloads.
# Runs by hand (Actions tab -> Desktop builds -> Run workflow), on a v* tag, or when the packaging or this workflow
# changes on main or a feature/ branch. Never creates a release. Both targets are built with the script tested locally
# (packaging/desktop/build-desktop.mjs: @electron/packager and Electron fuses).
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main, 'feature/**']
    paths:
      - 'energy-strategy-tool/packaging/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read
  actions: read   # to fetch the bundled weather stations from the latest full "Weather data" run

env:
  PLAYWRIGHT_VERSION: 1.56.0

jobs:
  desktop:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            energy-strategy-tool/app/package-lock.json
            energy-strategy-tool/packaging/package-lock.json
      - name: Build the web app
        working-directory: energy-strategy-tool/app
        run: |
          npm ci
          npm run build
      - name: Install packaging dependencies
        working-directory: energy-strategy-tool/packaging
        run: npm ci
      - name: Fetch the bundled weather stations (latest full "Weather data" run)
        # Only a full build: not a trial, the default years (2010-2024) and minimum years (10), all nine country groups,
        # and at least 1,500 stations (R3 M4). A tagged release fails without one; other builds go on with a warning,
        # and the program then says the stations are missing (R3 M5).
        working-directory: energy-strategy-tool/packaging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p weather
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow weather-data.yml --status success --limit 40 --json databaseId -q '.[].databaseId'); do
            rm -rf /tmp/w && mkdir -p /tmp/w
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n weather-stations -D /tmp/w 2>/dev/null || continue
            ok=$(node -e "try{const s=require('/tmp/w/weather-summary.json'); const r=s.runInputs||{}; console.log(s.trial===false && r.years==='2010-2024' && r.minYears===10 && s.groups===9 && s.stations>=1500 ? 'yes':'no')}catch{console.log('no')}")
            if [ "$ok" = "yes" ]; then cp /tmp/w/weather-stations.json.gz /tmp/w/weather-summary.json weather/; echo "::notice title=Weather stations::$(node -e "console.log(require('/tmp/w/weather-summary.json').stations)") stations from run $id"; break; fi
          done
          if [ ! -f weather/weather-stations.json.gz ]; then
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then echo "::error title=Weather stations::no full Weather data build found; a release needs one"; exit 1; fi
            echo "::warning title=Weather stations::no full Weather data build found; this program has no NOAA stations"
          fi
      - name: Build ${{ matrix.target }}
        working-directory: energy-strategy-tool/packaging
        run: node desktop/build-desktop.mjs --platforms ${{ matrix.target }}
      - name: Test the Linux build (virtual display)
        if: matrix.target == 'linux-x64'
        working-directory: energy-strategy-tool/packaging
        run: |
          npm install --no-save playwright@${PLAYWRIGHT_VERSION}
          npx playwright install-deps chromium
          sudo apt-get install -y xvfb strace
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, which Chromium's sandbox needs; allow
          # them on this runner so the program is tested with its sandbox on (not with --no-sandbox).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npm run test:desktop
      - name: Upload the Windows program
        if: matrix.target == 'win32-x64'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            energy-strategy-tool/packaging/out/desktop/*.zip
            energy-strategy-tool/packaging/out/desktop/*.tar.gz
            energy-strategy-tool/packaging/out/desktop/SHA256SUMS.txt
            energy-strategy-tool/packaging/out/desktop/build-desktop.json
          if-no-files-found: error
      - name: Upload the Linux test results
        if: matrix.target == 'linux-x64' && always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: energy-strategy-tool/packaging/test-results/desktop.json
          if-no-files-found: ignore
