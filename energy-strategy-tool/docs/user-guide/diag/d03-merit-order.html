<!doctype html><html><head><meta charset='utf-8'><style>html,body{margin:0;background:#fff}svg{display:block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="946" viewBox="0 0 1200 946" font-family="Inter, sans-serif"><defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1f22"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#62676f"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#3f444b" stroke-width="3"/></pattern>
<pattern id="hatchl" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#8a8f98" stroke-width="3"/></pattern>
<pattern id="dots" patternUnits="userSpaceOnUse" width="10" height="10"><rect width="10" height="10" fill="#ffffff"/><circle cx="5" cy="5" r="2" fill="#3f444b"/></pattern>
</defs><rect width="1200" height="946" fill="#ffffff"/><text x="40.0" y="50.0" font-size="32" font-weight="700" text-anchor="start" fill="#1d1f22" >Merit order: how each hour is supplied</text><circle cx="80" cy="132" r="28" fill="#1d1f22"/><text x="80.0" y="142.0" font-size="27" font-weight="800" text-anchor="middle" fill="#fff" >1</text><rect x="126.0" y="86.0" width="1034.0" height="104.0" rx="8" fill="#fff" stroke="#62676f" stroke-width="1.5" /><text x="148.0" y="122.0" font-size="26" font-weight="700" text-anchor="start" fill="#1d1f22" >On-site renewables</text><text x="148.0" y="150.0" font-size="21" font-weight="400" text-anchor="start" fill="#3f444b" >Solar and wind serve the load first. Surplus is kept for battery charging, export or</text><text x="148.0" y="174.0" font-size="21" font-weight="400" text-anchor="start" fill="#3f444b" >curtailment.</text><line x1="80.0" y1="162.0" x2="80.0" y2="204.0" stroke="#1d1f22" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="80" cy="254" r="28" fill="#1d1f22"/><text x="80.0" y="264.0" font-size="27" font-weight="800" text-anchor="middle" fill="#fff" >2</text><rect x="126.0" y="208.0" width="1034.0" height="104.0" rx="8" fill="#fff" stroke="#62676f" stroke-width="1.5" /><text x="148.0" y="244.0" font-size="26" font-weight="700" text-anchor="start" fill="#1d1f22" >PPA over the grid connection</text><text x="148.0" y="272.0" font-size="21" font-weight="400" text-anchor="start" fill="#3f444b" >Contracted PPA energy for the hour, up to the remaining load and the import capacity.</text><line x1="80.0" y1="284.0" x2="80.0" y2="326.0" stroke="#1d1f22" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="80" cy="376" r="28" fill="#1d1f22"/><text x="80.0" y="386.0" font-size="27" font-weight="800" text-anchor="middle" fill="#fff" >3</text><rect x="126.0" y="330.0" width="1034.0" height="104.0" rx="8" fill="#fff" stroke="#62676f" stroke-width="1.5" /><text x="148.0" y="366.0" font-size="26" font-weight="700" text-anchor="start" fill="#1d1f22" >Battery discharge</text><text x="148.0" y="394.0" font-size="21" font-weight="400" text-anchor="start" fill="#3f444b" >Per role: cover a shortfall against the grid limit, and/or the day's dearest hours.</text><line x1="80.0" y1="406.0" x2="80.0" y2="448.0" stroke="#1d1f22" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="80" cy="498" r="28" fill="#1d1f22"/><text x="80.0" y="508.0" font-size="27" font-weight="800" text-anchor="middle" fill="#fff" >4</text><rect x="126.0" y="452.0" width="1034.0" height="104.0" rx="8" fill="#fff" stroke="#62676f" stroke-width="1.5" /><text x="148.0" y="488.0" font-size="26" font-weight="700" text-anchor="start" fill="#1d1f22" >Firm on-site plant</text><text x="148.0" y="516.0" font-size="21" font-weight="400" text-anchor="start" fill="#3f444b" >Runs if cheaper than grid import, or to cover a grid shortfall; must-run when islanded.</text><line x1="80.0" y1="528.0" x2="80.0" y2="570.0" stroke="#1d1f22" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="80" cy="620" r="28" fill="#1d1f22"/><text x="80.0" y="630.0" font-size="27" font-weight="800" text-anchor="middle" fill="#fff" >5</text><rect x="126.0" y="574.0" width="1034.0" height="104.0" rx="8" fill="#fff" stroke="#62676f" stroke-width="1.5" /><text x="148.0" y="610.0" font-size="26" font-weight="700" text-anchor="start" fill="#1d1f22" >Grid import</text><text x="148.0" y="638.0" font-size="21" font-weight="400" text-anchor="start" fill="#3f444b" >Up to the offered capacity (“Show unmet load”), or uncapped (“Show exceedance”).</text><line x1="80.0" y1="650.0" x2="80.0" y2="692.0" stroke="#1d1f22" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="80" cy="742" r="28" fill="#1d1f22"/><text x="80.0" y="752.0" font-size="27" font-weight="800" text-anchor="middle" fill="#fff" >6</text><rect x="126.0" y="696.0" width="1034.0" height="104.0" rx="8" fill="#fff" stroke="#62676f" stroke-width="1.5" /><text x="148.0" y="732.0" font-size="26" font-weight="700" text-anchor="start" fill="#1d1f22" >Flexibility, then unmet load</text><text x="148.0" y="760.0" font-size="21" font-weight="400" text-anchor="start" fill="#3f444b" >Curtail flexible IT load if on; whatever is left is recorded as unmet and flagged.</text><rect x="40.0" y="822.0" width="1120.0" height="104.0" rx="8" fill="#eef0f2"  /><text x="60.0" y="856.0" font-size="23" font-weight="700" text-anchor="start" fill="#3f444b" >After the hour is supplied</text><text x="60.0" y="884.0" font-size="20" font-weight="400" text-anchor="start" fill="#3f444b" >The battery charges only in hours with no discharge: first from surplus on-site generation, then from</text><text x="60.0" y="910.0" font-size="20" font-weight="400" text-anchor="start" fill="#3f444b" >the grid in the day’s cheapest hours, within the connection. Remaining surplus is exported or curtailed.</text></svg></body></html>
